[project]
name = "media-mcp"
version = "0.1.0"
description = "Local MCP server for a safely configured media collection"
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=1,<2"]

[project.optional-dependencies]
dev = ["mypy", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["media_server"]

[project.scripts]
media-mcp = "media_server.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
